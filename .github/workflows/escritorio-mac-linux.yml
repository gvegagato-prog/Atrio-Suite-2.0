name: Atrio (PC, macOS solo revista, construido desde Linux)
# El Mac, construido desde Linux (GitHub a veces no arranca una máquina macOS: se queda en «waiting for a hosted runner to come
# online»). Es la edición «solo revista»: sin lanzador, sin abrir juegos, sin «Tu PC» (en macOS se activa sola; aquí se prueba
# en un Electron de verdad bajo Xvfb con ATRIO_SOLO_REVISTA=1). Luego construye Atrio.app para Apple Silicon y la firma
# «ad-hoc» con rcodesign (apple-codesign), que firma sin un Mac. Lo que NO se puede hacer aquí es abrir la app en macOS: solo se
# comprueba la estructura y la firma. escritorio-mac.yml hace la prueba en un macOS de verdad (cuando GitHub da máquina).
on:
  push:
    paths: ['escritorio/**', 'herramientas/**', '.github/workflows/escritorio-mac-linux.yml']
  workflow_dispatch:
jobs:
  mac-desde-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: escritorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias
        run: npm ci && node node_modules/electron/install.js
      - name: Pruebas de Escribir (guardado, sincronización, texto y exportar)
        working-directory: .
        run: |
          node herramientas/prueba-escritos.js
          node herramientas/prueba-escribir-texto.js
          node herramientas/prueba-escribir-export.js
          node herramientas/prueba-maqueta.js
          node herramientas/prueba-escribir-copias.js
          node herramientas/prueba-rt.js
          node herramientas/prueba-lector.js
          node herramientas/prueba-diccionario.js
      - name: Prueba de Atrio de verdad, en la edición solo revista (Electron bajo Xvfb)
        # Abre Atrio con una cuenta en un Firebase de mentira y comprueba, además de Escribir, que no hay lanzador: ni «Modo
        # Juegos», ni «Tu PC», ni abrir juegos, ni apagar el equipo, y que el equipo no se registra como controlable.
        working-directory: .
        env:
          ATRIO_SOLO_REVISTA: '1'
          PW: ${{ github.workspace }}/escritorio/node_modules/playwright-core
        run: |
          sudo apt-get install -y xvfb >/dev/null 2>&1 || true
          (cd escritorio && npm i --no-save playwright-core@1.56.1)
          node herramientas/prueba-escribir-atrio.js "$RUNNER_TEMP/atrio-prueba"
          # La maqueta de las fichas del móvil, pintada en Atrio, y la suite sin ofrecerse como PC (ve el móvil, pide sus fotos, sincroniza al momento)
          node herramientas/prueba-maqueta-atrio.js "$RUNNER_TEMP/maqueta-mac"
          # El lector de libros (la página del móvil): abrir un EPUB, pasar página, guardar lo leído y que viaje a la cuenta
          SOLO=1 node herramientas/prueba-lector-atrio.js "$RUNNER_TEMP/lector-mac"
          SOLO=1 node herramientas/prueba-suite.js
          # Escribir: lo último que se teclea queda guardado al cerrar (⌘W y ⌘Q) y al cerrar queda una copia de seguridad
          SOLO=1 node herramientas/prueba-escribir-cierre.js "$RUNNER_TEMP/cierre-mac"
          COMO=salir SOLO=1 node herramientas/prueba-escribir-cierre.js "$RUNNER_TEMP/cierre-mac-q"
      - name: Atrio.app (Apple Silicon, desde Linux)
        run: npx electron-builder --mac dir --arm64 --publish never
      - name: rcodesign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/indygreg/apple-platform-rs/releases?per_page=30" \
            | python3 -c "import sys,json; r=[x for x in json.load(sys.stdin) if x['tag_name'].startswith('apple-codesign')]; a=[y['browser_download_url'] for y in r[0]['assets'] if 'x86_64-unknown-linux-musl' in y['name'] and y['name'].endswith('.tar.gz')]; print(a[0])")
          echo "$url"
          mkdir -p "$RUNNER_TEMP/rc" && curl -fsSL "$url" | tar -xz -C "$RUNNER_TEMP/rc" --strip-components=1
          "$RUNNER_TEMP/rc/rcodesign" --version
      - name: "Firma ad-hoc y comprobación (sin Mac, solo se mira la estructura)"
        run: |
          APP=dist/mac-arm64/Atrio.app
          file "$APP/Contents/MacOS/Atrio"
          "$RUNNER_TEMP/rc/rcodesign" sign "$APP"
          "$RUNNER_TEMP/rc/rcodesign" print-signature-info "$APP" | head -40
          "$RUNNER_TEMP/rc/rcodesign" verify "$APP/Contents/MacOS/Atrio" || echo "verify: ver arriba"
      - name: Zip
        run: |
          mkdir -p salida
          (cd dist/mac-arm64 && zip -ryq "$GITHUB_WORKSPACE/escritorio/salida/Atrio-mac-arm64-solo-revista.zip" Atrio.app)
          ls -la salida
      - uses: actions/upload-artifact@v4
        with:
          name: Atrio-macOS-arm64-solo-revista-desde-Linux
          path: escritorio/salida/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atrio-solo-revista-pruebas
          path: |
            ${{ runner.temp }}/atrio-prueba/*.png
            ${{ runner.temp }}/atrio-prueba/atrio.log
