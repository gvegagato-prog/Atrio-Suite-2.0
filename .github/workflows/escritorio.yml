name: Atrio (PC, Linux)
on:
  push:
    paths: ['escritorio/**', 'herramientas/**', '.github/workflows/escritorio.yml']
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias
        working-directory: escritorio
        run: npm ci && node node_modules/electron/install.js
      - name: Escribir (guardado, sincronización, texto y exportar)
        run: |
          node herramientas/prueba-escritos.js
          node herramientas/prueba-escribir-texto.js
          node herramientas/prueba-escribir-export.js
          node herramientas/prueba-escribir-copias.js
      - name: Tu nube (kDrive de mentira)
        run: node herramientas/prueba-nube.js
      - name: Prueba PC + móvil (Firebase de mentira + Atrio de verdad + móvil simulado)
        run: node herramientas/prueba-suite.js
        env:
          OUT: ${{ github.workspace }}/prueba-suite
      - name: "Edición solo revista (la del Mac): ve el móvil, pide sus fotos y sincroniza al momento, sin ofrecerse como PC"
        run: node herramientas/prueba-suite.js
        env:
          SOLO: '1'
          OUT: ${{ github.workspace }}/prueba-suite-mac
      - name: Maquetas de las fichas (las del móvil, también en la edición del Mac)
        env:
          PW: ${{ github.workspace }}/escritorio/node_modules/playwright-core
        run: |
          node herramientas/prueba-maqueta.js
          (cd escritorio && npm i --no-save playwright-core@1.56.1)
          node herramientas/prueba-maqueta-atrio.js "$RUNNER_TEMP/maqueta-pc"
          SOLO=1 node herramientas/prueba-maqueta-atrio.js "$RUNNER_TEMP/maqueta-mac"
          node herramientas/prueba-escribir-cierre.js "$RUNNER_TEMP/cierre-pc"
          COMO=salir SOLO=1 node herramientas/prueba-escribir-cierre.js "$RUNNER_TEMP/cierre-mac"
      - name: Capturas de la interfaz
        if: always()
        run: node herramientas/capturas-atrio.js capturas
      - name: AppImage
        working-directory: escritorio
        run: npx electron-builder --linux AppImage --publish never
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atrio-capturas-y-registros
          path: |
            capturas
            prueba-suite/*.log
            prueba-suite/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: Atrio-AppImage
          path: escritorio/dist/*.AppImage
