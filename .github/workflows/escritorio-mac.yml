name: Atrio (PC, macOS Apple Silicon)
on:
  push:
    paths: ['escritorio/**', 'herramientas/**', '.github/workflows/escritorio-mac.yml']
  workflow_dispatch:
jobs:
  mac:
    # Se prueba en dos versiones de macOS, las dos Apple Silicon (arm64): la 15 y la 26 (la «latest» de GitHub). Si una no
    # consigue máquina, la otra sigue. (macos-14 se retira el 2 de noviembre de 2026)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, sufijo: '' }
          - { os: macos-26, sufijo: '-macos26' }
    name: mac (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: escritorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias
        run: npm ci
      - name: Pruebas de Escribir (guardado, sincronización, texto y exportar)
        working-directory: .
        run: |
          node herramientas/prueba-escritos.js
          node herramientas/prueba-escribir-texto.js
          node herramientas/prueba-escribir-export.js
      - name: Atrio.app (Apple Silicon)
        run: npx electron-builder --mac dir --arm64 --publish never
      - name: Firma ad-hoc y comprobación
        run: |
          APP=dist/mac-arm64/Atrio.app
          file "$APP/Contents/MacOS/Atrio"
          # Sin certificado de Apple Developer: firma «ad-hoc» (sin ella, un Mac con Apple Silicon no abre la app)
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | head -12
          lipo -archs "$APP/Contents/MacOS/Atrio"
      - name: Prueba de Atrio de verdad (la app firmada, por CDP)
        # Abre Atrio.app con una cuenta en un Firebase de mentira y lo maneja como una persona: Escribir sube y baja en
        # directo, sin conexión y al volver, tipografía, deshacer y rehacer, PDF y Word. Deja capturas de pantalla.
        working-directory: .
        env:
          ATRIO_BIN: ${{ github.workspace }}/escritorio/dist/mac-arm64/Atrio.app/Contents/MacOS/Atrio
          PW: ${{ github.workspace }}/escritorio/node_modules/playwright-core
        run: |
          (cd escritorio && npm i --no-save playwright-core@1.56.1)
          # poppler (pdftotext, pdffonts) para mirar los PDF por dentro; si no se instala, la prueba lo dice y sigue
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install poppler >/dev/null 2>&1 || echo "sin poppler"
          node herramientas/prueba-escribir-atrio.js "$RUNNER_TEMP/atrio-prueba"
      - name: Zip y DMG (con el acceso a Aplicaciones para arrastrar)
        run: |
          mkdir -p salida dmg
          ditto -c -k --sequesterRsrc --keepParent dist/mac-arm64/Atrio.app "salida/Atrio-mac-arm64.zip"
          ditto dist/mac-arm64/Atrio.app dmg/Atrio.app
          ln -s /Applications dmg/Aplicaciones
          hdiutil create -volname "Atrio" -srcfolder dmg -ov -format UDZO "salida/Atrio-mac-arm64.dmg"
          # Comprobación: el DMG se monta y trae la app firmada y el acceso a Aplicaciones
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "salida/Atrio-mac-arm64.dmg"
          ls -la "$RUNNER_TEMP/dmg"
          test -L "$RUNNER_TEMP/dmg/Aplicaciones"
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/Atrio.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
          ls -la salida
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Atrio-macOS-arm64${{ matrix.sufijo }}
          path: |
            escritorio/salida/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atrio-mac-pruebas${{ matrix.sufijo }}
          path: |
            ${{ runner.temp }}/atrio-prueba/*.png
            ${{ runner.temp }}/atrio-prueba/atrio.log
            ${{ runner.temp }}/atrio-prueba/exportado/*
