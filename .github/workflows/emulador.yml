name: Prueba en emulador (Atrio móvil + PC)
on:
  push:
    paths: ['movil/**', 'escritorio/src/**', 'herramientas/**', '.github/workflows/emulador.yml']
  workflow_dispatch:
    inputs:
      api:
        description: 'Versión de Android del emulador (API)'
        default: '29'
jobs:
  humo:
    # Solo cada pocas versiones o con cambios grandes: a mano, o si el commit lleva «[emulador]»
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emulador]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      # El emulador necesita ~7 GB libres y Electron + Gradle ocupan mucho: se quita lo que no se usa del runner
      - name: Liberar espacio
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk /usr/share/swift /usr/local/.ghcup || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilar versión optimizada
        working-directory: movil
        run: gradle assembleRelease
      - name: Atrio en el PC (para la parte en directo)
        working-directory: escritorio
        run: npm ci && node node_modules/electron/install.js
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api || '29' }}
          arch: x86_64
          target: default
          profile: pixel_4
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          disk-size: 4096M
          script: bash herramientas/humo.sh
      - name: Errores
        if: failure()
        shell: bash
        run: |
          if [ -f humo_out/crash.txt ]; then head -60 humo_out/crash.txt | while IFS= read -r l; do echo "::error::${l:0:900}"; done; fi
          if [ -f humo_out/pasos.txt ]; then tail -25 humo_out/pasos.txt | while IFS= read -r l; do echo "::error::${l:0:900}"; done; fi
      - name: Pasos
        if: always()
        run: cat humo_out/pasos.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulador-capturas
          path: humo_out
